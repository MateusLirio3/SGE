<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações · SIGA</title>
    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/components.css">
    <link rel="stylesheet" href="../../static/css/coordenador/coordenador.css">
    <link rel="stylesheet" href="../../static/css/coordenador/configuracoes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="dashboard">
        <div class="config-grid">
            <div class="config-card">
                <div class="config-card-header">
                    <i class="fas fa-user-circle"></i>
                    <h2>Perfil</h2>
                </div>
                <div class="config-card-body">
                    <div class="config-item">
                        <label>Nome</label>
                        <input type="text" value="Coordenador" id="nomePerfil">
                    </div>
                    <div class="config-item">
                        <label>Email</label>
                        <input type="email" value="coordenador@siga.com" id="emailPerfil">
                    </div>
                    <div class="config-item">
                        <label>Telefone</label>
                        <input type="text" value="(11) 99999-9999" id="telefonePerfil">
                    </div>
                    <button class="btn-save" onclick="salvarConfig('Perfil')">Salvar</button>
                </div>
            </div>

            <div class="config-card">
                <div class="config-card-header">
                    <i class="fas fa-server"></i>
                    <h2>Sistema</h2>
                </div>
                <div class="config-card-body">
                    <div class="config-item">
                        <label>Nome do Sistema</label>
                        <input type="text" value="SIGA" id="nomeSistema">
                    </div>
                    <div class="config-item">
                        <label>Ano Letivo</label>
                        <input type="number" value="2026" id="anoLetivo">
                    </div>
                    <div class="config-item">
                        <label>Semestre</label>
                        <select id="semestre">
                            <option value="1">1° Semestre</option>
                            <option value="2" selected>2° Semestre</option>
                        </select>
                    </div>
                    <button class="btn-save" onclick="salvarConfig('Sistema')">Salvar</button>
                </div>
            </div>

            <div class="config-card">
                <div class="config-card-header">
                    <i class="fas fa-bell"></i>
                    <h2>Notificações</h2>
                </div>
                <div class="config-card-body">
                    <div class="config-toggle">
                        <label>Notificações por email</label>
                        <input type="checkbox" checked id="notifEmail">
                    </div>
                    <div class="config-toggle">
                        <label>Alertas de matrícula</label>
                        <input type="checkbox" checked id="notifMatricula">
                    </div>
                    <div class="config-toggle">
                        <label>Alertas de frequência</label>
                        <input type="checkbox" id="notifFrequencia">
                    </div>
                    <button class="btn-save" onclick="salvarConfig('Notificações')">Salvar</button>
                </div>
            </div>

            <div class="config-card">
                <div class="config-card-header">
                    <i class="fas fa-shield-alt"></i>
                    <h2>Segurança</h2>
                </div>
                <div class="config-card-body">
                    <div class="config-item">
                        <label>Senha atual</label>
                        <input type="password" placeholder="Digite sua senha atual" id="senhaAtual">
                    </div>
                    <div class="config-item">
                        <label>Nova senha</label>
                        <input type="password" placeholder="Digite a nova senha" id="novaSenha">
                    </div>
                    <div class="config-item">
                        <label>Confirmar nova senha</label>
                        <input type="password" placeholder="Confirme a nova senha" id="confirmarSenha">
                    </div>
                    <button class="btn-save" onclick="salvarConfig('Segurança')">Alterar Senha</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="../../static/js/Components/carregadorComponentes.js"></script>
    <script src="../../static/js/Coordenador/configuracoes.js"></script>
</body>

</html>
