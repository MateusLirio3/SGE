<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Aluno · SIGA</title>
    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/components.css">
    <link rel="stylesheet" href="../../static/css/coordenador/coordenador.css">
    <link rel="stylesheet" href="../../static/css/coordenador/alunos_detalhes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="dashboard">
        <div class="perfil-topo">
            <div class="perfil-avatar">
                <i class="fas fa-user-graduate"></i>
            </div>
            <div class="perfil-titulo">
                <h1 id="nome">Carregando...</h1>
                <p class="perfil-matricula"><i class="fas fa-id-card"></i> Matrícula: <span id="matricula">-</span></p>
                <div class="perfil-acoes">
                    <a href="/Alunos" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
                    <button class="btn-editar" onclick="abrirModalEditar()"><i class="fas fa-edit"></i> Editar</button>
                </div>
            </div>
            <div class="perfil-status">
                <span class="status-badge" id="status">-</span>
            </div>
        </div>

        <div class="info-cards">
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-graduation-cap"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Curso</span>
                    <span class="info-card-value" id="curso">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-door-open"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Turma</span>
                    <span class="info-card-value" id="turma">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-calendar-alt"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Nascimento</span>
                    <span class="info-card-value" id="nascimento">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-envelope"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Email</span>
                    <span class="info-card-value" id="email">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-phone"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Telefone</span>
                    <span class="info-card-value" id="telefone">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Endereço</span>
                    <span class="info-card-value" id="endereco">-</span>
                </div>
            </div>
            <div class="info-card full">
                <div class="info-card-icon"><i class="fas fa-id-card"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">CPF</span>
                    <span class="info-card-value" id="cpf">-</span>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalEditar">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-user-edit"></i> Editar Aluno</h2>
                <button class="modal-fechar" onclick="fecharModalEditar()">×</button>
            </div>
            <form id="formEditar" onsubmit="salvarEdicao(event)">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" id="editNome" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <label>Matrícula *</label>
                        <input type="text" id="editMatricula" placeholder="Ex: 2024001" required>
                    </div>
                    <div class="form-group">
                        <label>CPF *</label>
                        <input type="text" id="editCpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group">
                        <label>Curso *</label>
                        <select id="editCurso" required>
                            <option value="">Selecione</option>
                            <option value="Engenharia de Software">Engenharia de Software</option>
                            <option value="Ciência da Computação">Ciência da Computação</option>
                            <option value="Sistemas de Informação">Sistemas de Informação</option>
                            <option value="Análise de Sistemas">Análise de Sistemas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Turma</label>
                        <select id="editTurma">
                            <option value="">Selecione</option>
                            <option value="1° A">1° A</option>
                            <option value="1° B">1° B</option>
                            <option value="2° A">2° A</option>
                            <option value="2° B">2° B</option>
                            <option value="3° A">3° A</option>
                            <option value="3° B">3° B</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="editStatus">
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                            <option value="Pendente">Pendente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="editEmail" placeholder="email@exemplo.com">
                    </div>
                    <div class="form-group full-width">
                        <label>Telefone</label>
                        <input type="text" id="editTelefone" placeholder="(00) 00000-0000">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModalEditar()">Cancelar</button>
                    <button type="submit" class="btn-primary">Atualizar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../static/js/Components/carregadorComponentes.js"></script>
    <script src="../../static/js/Coordenador/coordenador.js"></script>
    <script src="../../static/js/Coordenador/aluno_detalhes.js"></script>
</body>

</html>
