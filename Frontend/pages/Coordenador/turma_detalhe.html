<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Turma · SIGA</title>
    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/components.css">
    <link rel="stylesheet" href="../../static/css/coordenador/coordenador.css">
    <link rel="stylesheet" href="../../static/css/coordenador/turma_detalhe.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="dashboard">
        <div class="perfil-topo">
            <div class="perfil-avatar">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="perfil-titulo">
                <h1 id="nome">Carregando...</h1>
                <p class="perfil-matricula"><i class="fas fa-graduation-cap"></i> Curso: <span id="curso">-</span></p>
                <div class="perfil-acoes">
                    <a href="/Turmas" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
                    <button class="btn-editar" onclick="abrirModalEditar()"><i class="fas fa-edit"></i> Editar</button>
                </div>
            </div>
            <div class="perfil-status">
                <span class="status-badge" id="status">-</span>
            </div>
        </div>

        <div class="info-cards">
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-clock"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Período</span>
                    <span class="info-card-value" id="periodo">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-users"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Alunos</span>
                    <span class="info-card-value" id="alunos">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-calendar-alt"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Ano</span>
                    <span class="info-card-value" id="ano">-</span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-card-icon"><i class="fas fa-chair"></i></div>
                <div class="info-card-content">
                    <span class="info-card-label">Vagas</span>
                    <span class="info-card-value" id="vagas">-</span>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalEditar">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Editar Turma</h2>
                <button class="modal-fechar" onclick="fecharModalEditar()">×</button>
            </div>
            <form id="formEditar" onsubmit="salvarEdicao(event)">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" id="editNome" placeholder="Ex: 3° A" required>
                    </div>
                    <div class="form-group">
                        <label>Curso *</label>
                        <select id="editCurso" required>
                            <option value="">Selecione</option>
                            <option value="Engenharia de Software">Engenharia de Software</option>
                            <option value="Ciência da Computação">Ciência da Computação</option>
                            <option value="Sistemas de Informação">Sistemas de Informação</option>
                            <option value="Análise de Sistemas">Análise de Sistemas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Período</label>
                        <select id="editPeriodo">
                            <option value="Matutino">Matutino</option>
                            <option value="Vespertino">Vespertino</option>
                            <option value="Noturno">Noturno</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="editStatus">
                            <option value="Ativa">Ativa</option>
                            <option value="Inativa">Inativa</option>
                            <option value="Concluída">Concluída</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ano</label>
                        <input type="number" id="editAno" placeholder="2026">
                    </div>
                    <div class="form-group">
                        <label>Vagas</label>
                        <input type="number" id="editVagas" placeholder="40">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModalEditar()">Cancelar</button>
                    <button type="submit" class="btn-primary">Atualizar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../static/js/Components/carregadorComponentes.js"></script>
    <script src="../../static/js/Coordenador/coordenador.js"></script>
    <script src="../../static/js/Coordenador/turma_detalhe.js"></script>
</body>

</html>
