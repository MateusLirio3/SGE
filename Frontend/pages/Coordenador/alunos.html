<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos · SIGA</title>
    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/components.css">
    <link rel="stylesheet" href="../../static/css/coordenador/coordenador.css">
    <link rel="stylesheet" href="../../static/css/coordenador/alunos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="dashboard">
        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nome, matrícula ou CPF..."
                    onkeyup="filtrar()">
            </div>
            <select id="filterCurso" onchange="filtrar()">
                <option value="">Todos os cursos</option>
                <option value="Engenharia de Software">Engenharia de Software</option>
                <option value="Ciência da Computação">Ciência da Computação</option>
                <option value="Sistemas de Informação">Sistemas de Informação</option>
                <option value="Análise de Sistemas">Análise de Sistemas</option>
            </select>
            <select id="filterStatus" onchange="filtrar()">
                <option value="">Todos os status</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
                <option value="Pendente">Pendente</option>
            </select>
            <button class="btn-filter" onclick="limparFiltros()">
                <i class="fas fa-undo"></i> Limpar
            </button>
            <button class="btn-primary" onclick="abrirModal()">
                <i class="fas fa-plus"></i> Novo Aluno
            </button>
            <span class="total-registros" id="totalRegistros">0 alunos</span>
        </div>

        <div class="card full">
            <div class="table-responsive">
                <table class="table-alunos">
                    <thead>
                        <tr>
                            <th style="width:50px;">#</th>
                            <th>Nome</th>
                            <th>Matrícula</th>
                            <th>CPF</th>
                            <th>Curso</th>
                            <th>Turma</th>
                            <th>Status</th>
                            <th style="width:130px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-user-plus"></i> Novo Aluno</h2>
                <button class="modal-fechar" onclick="fecharModal()">×</button>
            </div>
            <form id="form" onsubmit="salvar(event)">
                <input type="hidden" id="itemId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" id="nome" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <label>Matrícula *</label>
                        <input type="text" id="matricula" placeholder="Ex: 2024001" required>
                    </div>
                    <div class="form-group">
                        <label>CPF *</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group">
                        <label>Curso *</label>
                        <select id="curso" required>
                            <option value="">Selecione</option>
                            <option value="Engenharia de Software">Engenharia de Software</option>
                            <option value="Ciência da Computação">Ciência da Computação</option>
                            <option value="Sistemas de Informação">Sistemas de Informação</option>
                            <option value="Análise de Sistemas">Análise de Sistemas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Turma</label>
                        <select id="turma">
                            <option value="">Selecione</option>
                            <option value="1° A">1° A</option>
                            <option value="1° B">1° B</option>
                            <option value="2° A">2° A</option>
                            <option value="2° B">2° B</option>
                            <option value="3° A">3° A</option>
                            <option value="3° B">3° B</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                            <option value="Pendente">Pendente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="email@exemplo.com">
                    </div>
                    <div class="form-group full-width">
                        <label>Telefone</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btnSalvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../static/js/Components/carregadorComponentes.js"></script>
    <script src="/static/js/Coordenador/alunos.js"></script>
</body>

</html>
