<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina - Login </title>

    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/paginaLogin.css">

</head>
<body>
    <section class="container-login">

        <div class="saudacao">
            <h1> Bem-Vindo ao SGE </h1>
            <h2> Entre com suas credenciais </h2>
        </div>

            <form action="/login/submit" method="POST" id="form-login">
                <div class="campos-formulario">

                    <label class="grupo_login-label">Usuario</label>
                    <div class="grupo_login">

                        <input type="text" name="usuario" placeholder="Digite seu usuario" required>
                    </div>
                    
                    <label class="grupo_login-label">Senha</label>
                    <div class="grupo_login">
                        <input type="password" name="senha" placeholder="Digite sua senha" required>
                    </div>

                    <div class="login_esqueceu_senha">
                        <a href="">Esqueceu a senha</a>
                    </div>

                    <button class="login_botao">Entrar</button>

                </div>
            </form>

    </section>


    <script src="/static/js/toast.js"></script>
    <script src="/static/js/autenticacao/login.js"></script>

</body>
</html>
